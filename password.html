<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>密码生成器 · 效率小工具箱</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .pwd {
      margin-top: 20px;
      padding: 14px 16px;
      background: #f1f5f9;
      border-radius: 10px;
      font-family: Consolas, monospace;
      font-size: 1.15rem;
      word-break: break-all;
      min-height: 1.4em;
    }
    .checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
    .checks label { display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; }
    .checks input { width: auto; }
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="index.html">← 返回首页</a>
    <h1>🔑 密码生成器</h1>
    <p class="sub">用浏览器内置密码学随机源生成，全程不联网、不上传</p>

    <label for="length">长度（8–64）</label>
    <input type="number" id="length" min="8" max="64" value="16" />

    <label>字符集（至少勾选一类）</label>
    <div class="checks">
      <label><input type="checkbox" id="upper" checked /> 大写字母 A-Z</label>
      <label><input type="checkbox" id="lower" checked /> 小写字母 a-z</label>
      <label><input type="checkbox" id="digit" checked /> 数字 0-9</label>
      <label><input type="checkbox" id="special" /> 特殊符号 !@#$</label>
    </div>

    <div class="error" id="error"></div>
    <div class="pwd" id="output">点击「生成密码」</div>
    <div class="ok" id="ok"></div>

    <div class="btn-row">
      <button class="btn" id="genBtn">生成密码</button>
      <button class="btn ghost" id="copyBtn" disabled>复制</button>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const SETS = {
      upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      lower: "abcdefghijklmnopqrstuvwxyz",
      digit: "0123456789",
      special: "!@#$%^&*()-_=+[]{};:,.<>?"
    };

    function secureIndex(max) {
      // crypto.getRandomValues：浏览器内置密码学随机源（AC20，零网络请求）
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % max;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = secureIndex(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generate() {
      $("error").textContent = "";
      $("ok").textContent = "";
      let len = parseInt($("length").value);
      if (!Number.isInteger(len) || len < 8 || len > 64) {
        $("error").textContent = "长度需为 8–64 之间的整数";
        return;
      }
      const picked = Object.keys(SETS).filter(k => $(k).checked);
      if (picked.length === 0) {
        $("error").textContent = "请至少勾选一类字符集";
        return;
      }
      // 保证每种勾选的字符集至少出现一次，再从合并集合补足剩余长度
      const chars = picked.map(k => SETS[k][secureIndex(SETS[k].length)]);
      const all = picked.map(k => SETS[k]).join("");
      while (chars.length < len) chars.push(all[secureIndex(all.length)]);
      const pwd = shuffle(chars).join("");
      $("output").textContent = pwd;
      $("copyBtn").disabled = false;
    }

    $("genBtn").addEventListener("click", generate);

    $("copyBtn").addEventListener("click", async () => {
      const pwd = $("output").textContent;
      try {
        await navigator.clipboard.writeText(pwd);
        $("ok").textContent = "✓ 已复制到剪贴板";
        setTimeout(() => { $("ok").textContent = ""; }, 2000);
      } catch (e) {
        $("error").textContent = "复制失败，请手动选择复制";
      }
    });
  </script>
</body>
</html>
